
name: Generate GitHub Trophy

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Trophy
        uses: ryo-ma/github-profile-trophy@master
        with:
          username: mjotohot
          token: ${{ secrets.GITHUB_TOKEN }}
          output_path: trophy.svg
          theme: default

      - name: Prepare Trophy
        run: |
          mkdir -p public
          cp trophy.svg public/trophy.svg

      - name: Push Trophy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: trophy-output
          publish_dir: ./public
